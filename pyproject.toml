[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-olci-processor"
version = "1.0.0"
description = "Atmospheric correction and surface product generator for Sentinel-3 OLCI L1B data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "xarray>=2022.03.0",
    "netcdf4>=1.5.8",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
]

[project.scripts]
s3-process = "s3_olci.cli:main"
